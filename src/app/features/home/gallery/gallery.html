<section class="container" aria-labelledby="gallery-heading">
  <app-section-heading number="03" title="Outside the editor" headingId="gallery-heading" description="Family, friends, fresh air, and a very good co-pilot.">A.F.K.</app-section-heading>
  <p class="swipe-hint" id="gallery-hint">Swipe or use the arrow keys to explore the photos <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 12h16m-6-6 6 6-6 6" /></svg></p>
  <div class="photo-grid" tabindex="0" role="region" aria-label="Personal photos" aria-describedby="gallery-hint">
    @for (photo of photos; track photo.src) {
      <figure [class.portrait]="photo.height > photo.width">
        <img [src]="'photos/' + photo.src.replace('.avif', '-640.webp')" [srcset]="'photos/' + photo.src.replace('.avif', '-320.webp') + ' 320w, photos/' + photo.src.replace('.avif', '-640.webp') + ' 640w'" sizes="(max-width: 599px) 82vw, (max-width: 899px) 45vw, 340px" [alt]="photo.alt" [width]="photo.width" [height]="photo.height" loading="lazy" decoding="async">
        <figcaption>{{ photo.label }}</figcaption>
      </figure>
    }
  </div>
</section>
